[workspace]
resolver = "2"
members = [
    "crates/canon-model",
    "crates/canon-store",
    "crates/canon-ingest",
    "crates/canon-gate",
    "crates/canon-learn",
    "crates/canon-report",
    "crates/canon-cli",
    "crates/canon-fmt",
    "crates/canon-policy",
    "crates/canon-vocab",
    "crates/canon-plugin",
]

[workspace.package]
version = "0.30.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/journeyWorker/canon"

[workspace.dependencies]
# Internal crates
canon-model = { path = "crates/canon-model" }
canon-store = { path = "crates/canon-store" }
canon-ingest = { path = "crates/canon-ingest" }
canon-gate = { path = "crates/canon-gate" }
canon-learn = { path = "crates/canon-learn" }
canon-report = { path = "crates/canon-report" }
canon-fmt = { path = "crates/canon-fmt" }
canon-policy = { path = "crates/canon-policy" }
canon-vocab = { path = "crates/canon-vocab" }
canon-plugin = { path = "crates/canon-plugin" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Content hashing (skill materialization lock, D4)
sha2 = "0.10"

# Gzip: the embedded dashboard app (canon-cli build.rs + dashboard.rs)
flate2 = "1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# restriction
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
self_named_module_files = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# pedantic, selected
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
enum_glob_use = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_for_each = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_imports = "warn"

# Debug info: line tables for our crates (backtraces keep file:line), none for
# dependencies. `cargo test --workspace --no-run` from scratch (2026-10-28,
# forca-rust sandbox): full debug info 22.6 GB / 174 s, this 15.4 GB / 142 s.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size-optimized release profile. `panic = "abort"` is deliberately NOT
# set: canon-policy wraps the CEL compiler/interpreter in
# `std::panic::catch_unwind` (eval.rs/validate.rs) to convert a parser
# panic into `Err(PolicyError)` — abort would turn that into a process
# crash. LTO + one codegen unit + `opt-level = "s"` + symbol strip are
# the size levers that don't change runtime semantics.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
