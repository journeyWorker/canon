# S10 part2 pilot (openspec/changes/s10-vocab-pilot/): the evidence-kind
# domain canon's typed authoring vocabulary (canon-vocab's Type::Evidence,
# design.md D4) resolves `Type::Evidence`'s `kind` domain against for this
# repo -- canon-gate's own `PolicyResolution::trust_required` key set
# (crates/canon-vocab/src/policy_bridge.rs module doc: "whatever key
# vocabulary a repo's policy.yaml declares"). `test-run`/`manual-review`
# match the convention already used throughout canon-vocab's own fixtures
# (crates/canon-vocab/fixtures/atoms/good.yaml) and this change's own
# integration test suite (crates/canon-cli/tests/gate.rs). Additive: no
# `risk_routing`/`trust_sample`/`staleness` entries are declared, so this
# file does not itself engage `canon gate check`'s coverage/trust-ladder
# checks for any existing ledger content -- those checks key off records
# that explicitly opt in via their own `trust_ladder`/`risk_routing`
# companion tags, none of which this repo's ledger carries yet.
trust_required:
  test-run: agent
  manual-review: human


# Effect-aware approval tiers are additive and independent from risk_routing:
# risk_tiers:
#   high:
#     rank: 3
#     paths: ["src/auth/**", "migrations/**"]
#     effects: ["secret-access", "network-egress"]
#     min_human_approvals: 1
#   very-high:
#     rank: 4
#     paths: ["deploy/**"]
#     effects: ["destructive-operation", "production-deploy"]
#     min_human_approvals: 2
spec_coverage:
  require_evidence: true
  scope: [building, verifying]
  exclude_lanes: [process]
  # Every feature surface must specify at least one failure path; a
  # surface whose scenarios are all attested golden paths is still red.
  require_cases: [failure]


# Authenticated risk approvals use external SSH trust. Uncomment and pin a
# protected allowed-signers file (outside ordinary repo writes for production):
# approval:
#   allowed_signers: /etc/canon/allowed_signers
# A missing verifier counts zero approvals; canon never treats CANON_ACTOR,
# `verified`, or repository-controlled policy as human authentication.
# Sensitive query/export output is disabled unless an operator explicitly
# enables it and passes --include-sensitive.
query:
  allow_sensitive: false
