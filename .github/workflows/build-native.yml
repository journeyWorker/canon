name: Build Native (Test Only)

# Adapted from the vendored upstream release pipeline's build workflow (design
# D3): S0's acceptance bar (macOS arm64 + Linux x64 gnu) plus Windows x64
# msvc, the same three rows the sibling `lute` monorepo ships. Every
# matrix row builds on a host that natively matches the target triple
# (macos-14 runners are Apple Silicon; ubuntu-latest and windows-latest
# runners are x86_64), so no cross-compilation toolchain (zig /
# cargo-zigbuild) is needed for any row — that machinery only becomes
# necessary once a target is added whose triple doesn't match any
# available runner's native arch. The Windows row needs CMake + NASM
# (aws-lc-sys / ring build scripts); both ship on the windows-latest
# image. `binary_ext` is the only per-row difference the steps see.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  safety:
    name: Release workflow safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cross-workflow drift guard (the upstream release pipeline's lesson,
      # recommended action #1): fails the moment this workflow's build
      # matrix / env drifts from publish.yml's, or from the platform
      # package manifests. Dependency-free (stdlib python3).
      - name: Check release workflow safety
        run: python3 scripts/check-release-workflow-safety.py

  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs: safety
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
            package_dir: core-darwin-arm64
            binary_ext: ""
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_dir: core-linux-x64
            binary_ext: ""
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            package_dir: core-win32-x64
            binary_ext: ".exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: canon-cli-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build canon-cli binary
        run: cargo build --locked --release -p canon-cli --target ${{ matrix.settings.target }}

      - name: Strip binary
        if: matrix.settings.binary_ext == ''
        run: strip "target/${{ matrix.settings.target }}/release/canon"

      - name: Stage into platform package (local verification only — not committed)
        shell: bash
        run: |
          set -euo pipefail
          BIN="canon${{ matrix.settings.binary_ext }}"
          BIN_PATH="target/${{ matrix.settings.target }}/release/$BIN"
          (
            cd "$(dirname "$BIN_PATH")"
            if [ "${{ runner.os }}" = "macOS" ]; then
              shasum -a 256 "$BIN" > "$BIN.sha256"
            else
              sha256sum "$BIN" > "$BIN.sha256"
            fi
          )
          mkdir -p "packages/${{ matrix.settings.package_dir }}/bin"
          cp "$BIN_PATH" "packages/${{ matrix.settings.package_dir }}/bin/$BIN"
          chmod +x "packages/${{ matrix.settings.package_dir }}/bin/$BIN"
          "packages/${{ matrix.settings.package_dir }}/bin/$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: canon-binary-${{ matrix.settings.target }}
          path: |
            target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}
            target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}.sha256
          if-no-files-found: error
