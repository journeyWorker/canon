name: Build Native (Test Only)

# Adapted from the vendored upstream release pipeline's build workflow (design
# D3): S0's acceptance bar (macOS arm64 + Linux x64 gnu) plus Windows x64
# msvc, the same three rows the sibling `lute` monorepo ships. Every
# matrix row builds on a host that natively matches the target triple
# (macos-14 runners are Apple Silicon; ubuntu-latest and windows-latest
# runners are x86_64), so no cross-compilation toolchain (zig /
# cargo-zigbuild) is needed for any row — that machinery only becomes
# necessary once a target is added whose triple doesn't match any
# available runner's native arch. The Windows row needs CMake + NASM
# (aws-lc-sys / ring build scripts); both ship on the windows-latest
# image. `binary_ext` is the only per-row difference the steps see.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "packages/dashboard/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  safety:
    name: Release workflow safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cross-workflow drift guard (the upstream release pipeline's lesson,
      # recommended action #1): fails the moment this workflow's build
      # matrix / env drifts from publish.yml's, or from the platform
      # package manifests. Dependency-free (stdlib python3).
      - name: Check release workflow safety
        run: python3 scripts/check-release-workflow-safety.py

  # The dashboard app is built ONCE and every platform row below embeds this
  # same build in its binary (`CANON_DASHBOARD_DIST`, crates/canon-cli/build.rs),
  # so `canon dashboard` runs in any repo. scripts/check-release-workflow-safety.py
  # keeps both workflows doing exactly this.
  dashboard:
    name: Build dashboard app
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies from the frozen lockfile
        run: bun install --frozen-lockfile

      - name: Build the dashboard app
        run: bun run --cwd packages/dashboard build

      - name: Upload dashboard app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dashboard-app
          path: packages/dashboard/dist
          if-no-files-found: error

  # The man pages are generated from the clap tree (`clap_mangen`, the
  # `man` feature of canon-cli: never built into the shipped binary) and
  # shipped in the @journeykit/canon launcher package, which links them
  # (`directories.man`). One platform-independent build; no dashboard needed.
  man:
    name: Generate man pages
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: canon-cli-man-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Generate man pages
        run: cargo run --locked --release -p canon-cli --features man --example canon-man -- man-pages

      - name: Upload man pages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: man-pages
          path: man-pages
          if-no-files-found: error

  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs: [safety, dashboard]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
            package_dir: core-darwin-arm64
            binary_ext: ""
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_dir: core-linux-x64
            binary_ext: ""
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            package_dir: core-win32-x64
            binary_ext: ".exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: canon-cli-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Download dashboard app
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dashboard-app
          path: dashboard-app

      - name: Build canon-cli binary
        env:
          CANON_DASHBOARD_DIST: ${{ github.workspace }}/dashboard-app
        run: cargo build --locked --release -p canon-cli --target ${{ matrix.settings.target }}

      - name: Strip binary
        if: matrix.settings.binary_ext == ''
        run: strip "target/${{ matrix.settings.target }}/release/canon"

      - name: Stage into platform package (local verification only — not committed)
        shell: bash
        run: |
          set -euo pipefail
          BIN="canon${{ matrix.settings.binary_ext }}"
          BIN_PATH="target/${{ matrix.settings.target }}/release/$BIN"
          (
            cd "$(dirname "$BIN_PATH")"
            if [ "${{ runner.os }}" = "macOS" ]; then
              shasum -a 256 "$BIN" > "$BIN.sha256"
            else
              sha256sum "$BIN" > "$BIN.sha256"
            fi
          )
          mkdir -p "packages/${{ matrix.settings.package_dir }}/bin"
          cp "$BIN_PATH" "packages/${{ matrix.settings.package_dir }}/bin/$BIN"
          chmod +x "packages/${{ matrix.settings.package_dir }}/bin/$BIN"
          "packages/${{ matrix.settings.package_dir }}/bin/$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: canon-binary-${{ matrix.settings.target }}
          path: |
            target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}
            target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}.sha256
          if-no-files-found: error
