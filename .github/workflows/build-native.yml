name: Build Native (Test Only)

# Adapted from the vendored upstream release pipeline's build workflow (design
# D3), and the same four rows publish.yml releases: macOS arm64 (deployment
# target 15.0), Linux x64 and arm64 as static musl binaries (jemalloc is
# their allocator; glibc is not a floor), Windows x64 msvc with a static C
# runtime. Every row builds on a host that natively matches the target (the
# runners are pinned images, never `-latest`: macos-26, ubuntu-26.04,
# ubuntu-26.04-arm, windows-2025), so no cross-compilation toolchain (zig /
# cargo-zigbuild) is needed for any row. The Linux rows link on the host with
# `musl-tools` (.github/actions/setup-rust). The Windows row needs CMake + NASM
# (aws-lc-sys / ring build scripts); both ship on the windows-2025 image.
# `binary_ext` is the only per-row difference the steps see besides `lg_page`:
# the aarch64 musl row builds jemalloc for 64K pages. Each row reads its binary
# with scripts/check-release-binary.py (static, jemalloc, minos 15.0, no VC
# runtime DLL), and the smokes that run those binaries in containers belong to
# publish.yml only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "packages/dashboard/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The macOS binary's floor: its `minos` is exactly this (scripts/check-release-binary.py fails any other).
  MACOSX_DEPLOYMENT_TARGET: "15.0"

permissions:
  contents: read

# A new push to a pull request cancels the run before it (`workflow_dispatch` runs are their own group, the commit is in the name).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    name: Release workflow safety check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cross-workflow drift guard (the upstream release pipeline's lesson,
      # recommended action #1): fails the moment this workflow's build
      # matrix / env drifts from publish.yml's, or from the platform
      # package manifests. Dependency-free (stdlib python3).
      - name: Check release workflow safety
        run: python3 scripts/check-release-workflow-safety.py

  # The dashboard app is built ONCE and every platform row below embeds this
  # same build in its binary (`CANON_DASHBOARD_DIST`, crates/canon-cli/build.rs),
  # so `canon dashboard` runs in any repo. scripts/check-release-workflow-safety.py
  # keeps both workflows doing exactly this.
  dashboard:
    name: Build dashboard app
    needs: safety
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies from the frozen lockfile
        run: bun install --frozen-lockfile

      - name: Build the dashboard app
        run: bun run --cwd packages/dashboard build

      - name: Upload dashboard app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-app
          path: packages/dashboard/dist
          if-no-files-found: error

  # The man pages are generated from the clap tree (`clap_mangen`, the
  # `man` feature of canon-cli: never built into the shipped binary) and
  # shipped in the @journeykit/canon launcher package, which links them
  # (`directories.man`). One platform-independent build; no dashboard needed.
  man:
    name: Generate man pages
    needs: safety
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: canon-cli-man-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Generate man pages
        run: cargo run --locked --release -p canon-cli --features man --example canon-man -- man-pages

      - name: Upload man pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: man-pages
          path: man-pages
          if-no-files-found: error

  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs: [safety, dashboard]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26
            target: aarch64-apple-darwin
            package_dir: core-darwin-arm64
            binary_ext: ""
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            package_dir: core-linux-x64
            binary_ext: ""
          - host: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            package_dir: core-linux-arm64
            binary_ext: ""
            lg_page: "16"
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            package_dir: core-win32-x64
            binary_ext: ".exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: canon-cli-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Download dashboard app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-app
          path: dashboard-app

      - name: Build canon-cli binary
        shell: bash
        env:
          CANON_DASHBOARD_DIST: ${{ github.workspace }}/dashboard-app
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ matrix.settings.lg_page }}
        run: |
          set -euo pipefail
          # Only the aarch64 musl row has a page size: an empty variable is no variable.
          [ -n "$JEMALLOC_SYS_WITH_LG_PAGE" ] || unset JEMALLOC_SYS_WITH_LG_PAGE
          cargo build --locked --release -p canon-cli --target ${{ matrix.settings.target }}

      - name: Strip binary
        if: matrix.settings.binary_ext == ''
        run: strip "target/${{ matrix.settings.target }}/release/canon"

      # The floor this row promises, read from the binary it just built (the
      # evidence that the pins took: static + jemalloc + 64K pages, minos 15.0,
      # no VC runtime DLL). The log of this step is the proof for a PR.
      - name: Check the binary keeps the floor of its platform
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/check-release-binary.py --target "${{ matrix.settings.target }}" "target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}"

      - name: Stage into platform package (local verification only — not committed)
        shell: bash
        run: |
          set -euo pipefail
          BIN="canon${{ matrix.settings.binary_ext }}"
          BIN_PATH="target/${{ matrix.settings.target }}/release/$BIN"
          (
            cd "$(dirname "$BIN_PATH")"
            if [ "${{ runner.os }}" = "macOS" ]; then
              shasum -a 256 "$BIN" > "$BIN.sha256"
            else
              sha256sum "$BIN" > "$BIN.sha256"
            fi
          )
          mkdir -p "packages/${{ matrix.settings.package_dir }}/bin"
          cp "$BIN_PATH" "packages/${{ matrix.settings.package_dir }}/bin/$BIN"
          chmod +x "packages/${{ matrix.settings.package_dir }}/bin/$BIN"
          "packages/${{ matrix.settings.package_dir }}/bin/$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canon-binary-${{ matrix.settings.target }}
          path: |
            target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}
            target/${{ matrix.settings.target }}/release/canon${{ matrix.settings.binary_ext }}.sha256
          if-no-files-found: error
