name: PR Guard

# Two fast checks that run on EVERY pull request, with no `paths:` filter.
# 0.30's release PR touched so many files that the path-filtered workflows may
# not have run, and the release then failed twice after the tag: the release
# workflow safety check and the man-page generator build. Both are cheap here,
# so a filter can never hide them. The release-profile man-page build runs
# in build-native.yml in a release run only (`release/*` and manual runs); the
# debug `cargo check` below is what catches a broken generator in every other
# pull request.

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

# A new push to a pull request cancels the run before it (`workflow_dispatch` runs are their own group, the commit is in the name).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    name: Release workflow safety check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release workflow safety
        run: python3 scripts/check-release-workflow-safety.py

  man-check:
    name: Man-page generator builds (cargo check)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: canon-pr-guard-man-check-cargo-${{ hashFiles('Cargo.lock') }}

      - name: cargo check the man-page generator
        run: cargo check --locked -p canon-cli --features man --example canon-man
