name: Set up Rust
description: >-
  Installs the toolchain pinned in rust-toolchain.toml with rustup (never a
  floating `stable`), optionally adds one target, logs `rustc --version`, and
  fails when that version differs from the pinned channel.

inputs:
  target:
    description: Extra compilation target to add (a release matrix row's own triple).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # With no toolchain argument, rustup installs the one rust-toolchain.toml
    # names, with its profile and components.
    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install

    - name: Add the target
      if: inputs.target != ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: rustup target add "$TARGET"

    - name: Check rustc is the pinned version
      shell: bash
      run: |
        set -euo pipefail
        want=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        rustc --version
        got=$(rustc --version | cut -d' ' -f2)
        if [ -z "$want" ] || [ "$got" != "$want" ]; then
          echo "::error::rustc is '$got', rust-toolchain.toml pins '$want'" >&2
          exit 1
        fi
