name: Set up Rust
description: >-
  Installs the toolchain pinned in rust-toolchain.toml with rustup (never a
  floating `stable`), optionally adds one target (a Linux musl target also
  gets the musl C toolchain), logs `rustc --version`, and fails when that
  version differs from the pinned channel.

inputs:
  target:
    description: Extra compilation target to add (a release matrix row's own triple).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # With no toolchain argument, rustup installs the one rust-toolchain.toml
    # names, with its profile and components.
    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install

    - name: Add the target
      if: inputs.target != ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: rustup target add "$TARGET"

    # The x86_64 musl row links its static binary on the Ubuntu host: musl-tools
    # is the C compiler (`musl-gcc`) the C code of the dependencies compiles with
    # (aws-lc-sys, ring, SQLite, zstd, jemalloc); the `cc` crate is told to use it
    # for this target. The aarch64 musl row does not come here: its jemalloc does
    # not compile with Ubuntu's musl-gcc, so it builds in an Alpine image.
    - name: Install the musl C toolchain
      if: contains(inputs.target, '-linux-musl')
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq musl-tools
        musl-gcc --version | head -n 1
        echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

    - name: Check rustc is the pinned version
      shell: bash
      run: |
        set -euo pipefail
        want=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        rustc --version
        got=$(rustc --version | cut -d' ' -f2)
        if [ -z "$want" ] || [ "$got" != "$want" ]; then
          echo "::error::rustc is '$got', rust-toolchain.toml pins '$want'" >&2
          exit 1
        fi
