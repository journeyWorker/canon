description: "0.30 F2 + 0.23 D6: in a 0.29 repo the write is refused (LAYOUT_MIGRATION_REQUIRED) and the gate reports the old-named files, then `canon migrate` renames the ledger and pins the review in one run. A review written before review pinning (pinned to a commit this clone does not have, simulated with a fake sha) does not count until `canon migrate` rewrites it to what the evidence says: `canon subject status <id> --to verifying` and `canon gate check` (while the subject is still building) prints the advisory naming `canon migrate`, and after the migration, which pins it as the scenario stands because its commit cannot be read, the transition and the gate exit 0"
steps:
  - args: [subject, move, cart, --to, verifying]
    exit: 2
  - args: [gate, check]
    exit: 1
  - args: [migrate]
    exit: 0
  - args: [migrate, --commit, --plan-digest, "sha256:6231adf7b526bd9960b79721e992c0841a99c48d1d2345401d3d8d120fe1b23a"]
    exit: 0
  - args: [subject, move, cart, --to, verifying]
    exit: 0
  - args: [gate, check]
    exit: 0
