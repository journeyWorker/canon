description: "0.30 F2 + 0.23 D6: in a 0.29 repo the write is refused (OLD_LAYOUT) and the gate reports the old-named files, then `canon migrate` renames the ledger and pins the review in one run. A review written before review pinning (pinned to a commit this clone does not have, simulated with a fake sha) does not count until `canon migrate` rewrites it to what the evidence says: `canon subject status <id> --to verifying` and `canon gate check` (while the subject is still building) prints the advisory naming `canon migrate`, and after the migration, which pins it as the scenario stands because its commit cannot be read, the transition and the gate exit 0"
steps:
  - args: [subject, move, cart, --to, verifying]
    exit: 2
  - args: [gate, check]
    exit: 1
  - args: [migrate]
    exit: 0
  - args: [migrate, --commit, --plan-digest, "sha256:ad1501e4ae9454b5031340a351bcbc64203f55e0ca9084d88e2f13abc63105aa"]
    exit: 0
  - args: [subject, move, cart, --to, verifying]
    exit: 0
  - args: [gate, check]
    exit: 0
