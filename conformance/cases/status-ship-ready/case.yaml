description: "`canon status` names `canon subject status <id> --to shipped` for a verifying subject with every scenario evidenced, every required case present and its brief approved (an `Approved:` line in its change's .canon/changes brief.md); following it exits 0, after which status reports the subject shipped and nothing next"
steps:
  - args: [status]
    exit: 0
  - args: [subject, move, checkout, --to, shipped]
    exit: 0
  - args: [status, --json]
    exit: 0
