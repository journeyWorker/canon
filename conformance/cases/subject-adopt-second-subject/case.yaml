description: "0.18 D4 (#28): after `canon change new refactor-core --subject-id perception`, `canon subject adopt refactor-core --subject-id editing` adds the subject, says the change now belongs to both (exit 0) and never re-points; a rerun writes nothing; `canon query --kind subject --json` lists the change under both"
steps:
  - args: [init, --providers, none]
    exit: 0
  - args: [subject, new, perception, --domain, dev, --title, Perception]
    exit: 0
  - args: [subject, new, editing, --domain, dev, --title, Editing]
    exit: 0
  - args: [change, new, refactor-core, --subject-id, perception, --title, Refactor core]
    exit: 0
  - args: [subject, adopt, refactor-core, --subject-id, editing]
    exit: 0
  - args: [subject, adopt, refactor-core, --subject-id, editing]
    exit: 0
  - args: [query, --kind, subject, --json]
    exit: 0
