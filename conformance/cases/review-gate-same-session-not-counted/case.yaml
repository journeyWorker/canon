description: "Under `require_review.distinct_actor`, a review by another actor id from a session that attested the scenario's evidence does not count: `evidence add --session` stages (then `gate promote`), `review add --session` writes directly, `canon subject status <id> --to verifying` exits 1 with `unreviewed-promotion` naming the session rule, and a review from a different session lets it through (exit 0)"
steps:
  - args: [evidence, add, --scenario, cart.add.01, --project, root, --class, test-run, --ref, cargo test cart_add, --role, implementer, --actor, impl-agent, --session, sess-impl]
    exit: 0
  - args: [gate, promote]
    exit: 0
  - args: [review, scenario, cart.add.01, --project, root, --original-spec-ref, specs/kind=feature/area=cart/add.feature, --actor, reviewer-2, --role, reviewer, --session, sess-impl]
    exit: 0
  - args: [subject, move, cart, --to, verifying]
    exit: 1
  - args: [review, scenario, cart.add.01, --project, root, --original-spec-ref, specs/kind=feature/area=cart/add.feature, --actor, reviewer-2, --role, reviewer, --session, sess-review]
    exit: 0
  - args: [subject, move, cart, --to, verifying]
    exit: 0
