description: "A defect the author found in its own work is recorded with `--actor` set to the author: `finding add --introduced-rev self` is a usage error (exit 2) pointing at `--actor`, the author's own `finding add` stages (exit 0), and once promoted its open blocker refuses `canon subject status <id> --to verifying` with `open-blocker` (exit 1) like a reviewer's would"
steps:
  - args: [finding, add, --change, c-cart, --round, "1", --seq, "1", --severity, blocker, --introduced-unknown, --actor, impl-agent, --summary, a second add leaves two rows, --role, implementer, --session, sess-impl, --introduced-rev, self]
    exit: 2
  - args: [finding, add, --change, c-cart, --round, "1", --seq, "1", --severity, blocker, --introduced-unknown, --actor, impl-agent, --summary, a second add leaves two rows, --role, implementer, --session, sess-impl]
    exit: 0
  - args: [gate, promote]
    exit: 0
  - args: [subject, move, cart, --to, verifying]
    exit: 1
