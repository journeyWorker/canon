description: "`canon init`'s starter policy is unapproved: `canon gate check` and `canon status` print a `policy not approved` advisory naming `canon policy approve` (exit 1: a fresh init has no scenario, subject or evidence for the gate to examine, so it is `unverifiable`, never clean); `canon policy approve --by <who> --note <text>` writes .canon/policy.approval.json directly (exit 0), after which the advisory is gone (the gate is still `unverifiable`)"
steps:
  - args: [init, --no-agents-md]
    exit: 0
  - args: [gate, check]
    exit: 1
  - args: [status]
    exit: 0
  - args: [policy, approve, --approver, alice, --note, reviewed the starter policy]
    exit: 0
  - args: [gate, check]
    exit: 1
