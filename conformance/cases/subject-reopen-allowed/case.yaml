description: "0.18 D3: a subject shipped on an approved brief reopens with `canon subject status <id> verifying --reason <text> --actor-id <id>` (exit 0), printing who reopened it, why, and the approved change the follow-up goes into; without `--reason` the reopen is a usage refusal (exit 2); shipping again passes its guards (exit 0)"
steps:
  - args: [subject, status, checkout, shipped]
    exit: 0
  - args: [subject, status, checkout, verifying]
    exit: 2
  - args: [subject, status, checkout, verifying, --reason, "follow-up: the pay retry double-charges", --actor-id, impl]
    exit: 0
  - args: [subject, status, checkout, shipped]
    exit: 0
