description: "0.24 D4: with --all-scenarios a bare --artifact is refused (exit 2, nothing written) because it would bind to every scenario; the report's own per-test attachments bind to the scenario that owns the case, and --artifact <scenario-id>=<path> binds one file to one scenario"
steps:
  - args: [inventory, sync]
    exit: 0
  - args: [evidence, add, --project-id, root, --all-scenarios, --report, junit:reports/junit.xml, --artifact, notes/qa.md, --kind, test-run, --ref, "npm test", --role, implementer, --actor-id, impl-agent]
    exit: 2
  - args: [evidence, add, --project-id, root, --all-scenarios, --report, junit:reports/junit.xml, --artifact, "cart.add.02=notes/qa.md", --kind, test-run, --ref, "npm test", --role, implementer, --actor-id, impl-agent]
    exit: 0
  - args: [gate, promote]
    exit: 0
