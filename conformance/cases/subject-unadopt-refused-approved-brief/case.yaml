description: "0.25 D1 (#96): `canon subject unadopt <change> --subject <id>` refuses a change whose brief carries an `Approved:` line (SUBJECT_UNADOPT_REFUSED, exit 2): it is the subject's approved scope; an unknown change is refused like adopt (exit 2)"
steps:
  - args: [subject, unadopt, s, --change, a]
    exit: 2
  - args: [subject, unadopt, s, --change, a, --json]
    exit: 2
  - args: [subject, unadopt, s, --change, no-such-change]
    exit: 2
