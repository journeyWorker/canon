description: "0.28 D10: a 0.27 projection holds a full skill (`SKILL.md` plus a `reference/` file its install lock lists). `canon skills check` names the reference file as an orphan with the install command that removes it (exit 1), `canon skills doctor` names it on an `orphan:` line (exit 0), `canon skills install` writes the stub and prunes the file whose bytes still match the lock and reports `pruned:` (exit 0), and both are clean afterwards"
steps:
  - args: [skills, check, --providers, claude]
    exit: 1
  - args: [skills, doctor, --providers, claude]
    exit: 0
  - args: [skills, install, --providers, claude]
    exit: 0
  - args: [skills, check, --providers, claude]
    exit: 0
  - args: [skills, doctor, --providers, claude]
    exit: 0
