description: "0.18 D1: `--all-scenarios --verdict faithful` over a report in which one scenario's case failed refuses the whole batch (exit 1) naming the scenario and case, and nothing is staged; `--all-scenarios` with `--scenario-id`, or without `--project-id`, is refused (exit 2)"
steps:
  - args: [inventory, sync]
    exit: 0
  - args: [evidence, add, --project-id, root, --all-scenarios, --verdict, faithful, --report, junit:reports/junit.xml, --kind, test-run, --ref, "npm test", --role, implementer, --actor-id, impl-agent]
    exit: 1
  - args: [evidence, add, --project-id, root, --all-scenarios, --scenario-id, cart.add.01, --report, junit:reports/junit.xml, --kind, test-run, --ref, "npm test", --role, implementer]
    exit: 2
  - args: [evidence, add, --all-scenarios, --report, junit:reports/junit.xml, --kind, test-run, --ref, "npm test", --role, implementer]
    exit: 2
  - args: [gate, promote]
    exit: 0
