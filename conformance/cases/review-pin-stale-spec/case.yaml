description: "0.15 D1: `canon review add` pins the scenario's source digest and its latest evidence, so a fresh pinned review lets `canon subject status <id> verifying` through (exit 0) and `canon gate check` is clean with no legacy-review advisory; after the scenario text changes and `canon inventory sync` records it, the same review is stale: `canon gate check` exits 1 with `unreviewed-promotion` naming the spec change, and `canon status` counts the stale review"
steps:
  - args: [review, add, --project-id, root, --scenario-id, cart.add.01, --reviewer, reviewer-2, --pin, r1, --original-spec-ref, specs/features/kind=feature/area=cart/add.feature, --actor-id, reviewer-2, --role, reviewer, --session-id, sess-review]
    exit: 0
  - args: [subject, status, cart, verifying]
    exit: 0
  - args: [gate, check]
    exit: 0
  - args: [inventory, sync]
    exit: 0
  - args: [gate, check]
    exit: 1
  - args: [status]
    exit: 0
