[package]
name = "canon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "canon — single entrypoint binary (harness knowledge substrate)."

[lib]
name = "canon_cli"
path = "src/lib.rs"

[features]
# Builds the man-page generator (`cargo run -p canon-cli --features man --example canon-man -- <dir>`); packaging only.
man = ["dep:clap_mangen"]

[[example]]
name = "canon-man"
path = "examples/canon-man.rs"
required-features = ["man"]

[[bin]]
name = "canon"
path = "src/main.rs"

[dependencies]
atip.workspace = true
canon-fmt.workspace = true
canon-gate.workspace = true
canon-ingest.workspace = true
canon-learn.workspace = true
canon-model.workspace = true
canon-policy.workspace = true
canon-plugin.workspace = true
canon-report.workspace = true
canon-store.workspace = true
canon-vocab.workspace = true
chrono = { version = "0.4.45" }
clap = { workspace = true }
# `canon completion <SHELL>`: the shell scripts are generated from the clap tree at run time.
clap_complete = "4.5"
serde = { workspace = true }
serde_json = { workspace = true }
# Typed reports (`Report: Serialize + JsonSchema`) and the debug-build validation of every emitted JSON document (T7).
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
jsonschema = { version = "0.47.0", default-features = false }
# JUnit XML test reports (`canon evidence add --report junit:<path>`).
# Already in the lockfile transitively; a pure-Rust pull parser.
quick-xml = "0.40"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = { workspace = true }
# The derived search index (`canon search`, `canon trace`): SQLite with FTS5 and its trigram tokenizer, built from the records on demand.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = { workspace = true }
# The embedded dashboard app is stored gzip-compressed and decompressed for a browser that does not accept gzip.
flate2 = { workspace = true }

# No-follow directory handles (`openat(O_NOFOLLOW)`/`unlinkat`) for the legacy
# `.codex/skills` cleanup in `skills.rs`. Already in the lockfile via tempfile.
# Man pages (`examples/canon-man.rs`), generated at packaging only: the `man` feature is never on for the shipped binary.
clap_mangen = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
# Default SIGPIPE in `main` (0.20): `canon … | head` ends quietly instead of
# panicking on a closed stdout. Already in the lockfile.
libc = "0.2"

[build-dependencies]
flate2 = { workspace = true }

[dev-dependencies]
# `atip check`, run in-process against the canon binary (tests/atip_check.rs).
atip-check = { workspace = true }
tempfile = "3"
uuid = { version = "1.23.4", features = ["v4"] }

[lints]
workspace = true
