[package]
name = "atip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The atip/1 contract pieces a command-line tool shares: the generic projection of a clap tree onto the self-description documents, the error value and its redaction, the error-code row type, JSON-mode detection and the one-line envelope output, the shell quoting and splitting of next-step commands, and the contract's own JSON Schemas with a validator for envelopes. Depends on no canon crate, so it can move to the atip repository unchanged."

[lib]
name = "atip"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
# `float_roundtrip`: a number written with digits is read as the nearest double, so a digest of it is the same as every other
# implementation's (spec 12.6, the plan digest vectors). The feature is additive and applies to every crate of the workspace.
serde_json = { workspace = true, features = ["float_roundtrip"] }
schemars = "1.2.1"
# A JSON Schema validator, only with the feature `validate`: the checks of the contract's schemas (`schema::envelope_problems`
# and the other `*_problems`), the validation of a projected answer (`fields::projected_problems`) and the compiled domain
# (`domain::compile`). A tool that only builds documents and refuses arguments does not link it.
jsonschema = { version = "0.47.0", default-features = false, optional = true }
# The Rust reading of a domain `pattern` (spec 10.7.4): a pattern must compile with the crate's default limits, and
# `domain::admits` judges a `pattern` with it.
regex = "1"
# The SHA-256 of a cursor's binding and of a plan digest (`cursor`, `plan`).
sha2 = { workspace = true }

[features]
default = []
# The JSON Schema validation of documents (see `jsonschema` above). The checker and every test turn it on.
validate = ["dep:jsonschema"]

[dev-dependencies]
# The crate's own `validate` feature, for its tests (`cargo test -p atip` tests the validators too).
atip = { path = ".", features = ["validate"] }

[lints]
workspace = true
