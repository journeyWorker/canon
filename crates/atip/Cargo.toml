[package]
name = "atip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The atip/1 contract pieces a command-line tool shares: the generic projection of a clap tree onto the self-description documents, the error value and its redaction, the error-code row type, JSON-mode detection and the one-line envelope output, the shell quoting and splitting of next-step commands, and the contract's own JSON Schemas with a validator for envelopes. Depends on no canon crate, so it can move to the atip repository unchanged."

[lib]
name = "atip"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.2.1"
# Checks an envelope against the vendored contract schemas (`schema::envelope_problems`).
jsonschema = { version = "0.47.0", default-features = false }
# The Rust reading of a domain `pattern` (spec 10.7.4): a pattern must compile with the crate's default limits.
regex = "1"

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
