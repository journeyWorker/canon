<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>canon dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="banner" class="banner banner-loading">Loading snapshot…</header>
    <!--
      s43 round 2, finding 6. `panel-source` used to carry prose:
      "mart_review_rounds (findings per round; fix-of-fix is a derived
      floor)" and "mart_flywheel_funnel (verdicts → distilled →
      retrieved → applied)". Both were CLAIMS — the first was the
      retired FLOOR reading, still shipping here months after every
      other surface had dropped it; the second reads as a causal
      pipeline over a funnel whose own panel says it is co-occurrence.
      Static markup is the one surface `test/panel-copy.test.ts` could
      not reach, so a claim parked here was a claim no test checked.

      So this file now carries the VIEW NAME and nothing else. Every
      claim lives in a panel module's `NOTE`/`description`, which
      `renderTable` puts on the page and `panel-copy.test.ts` pins
      against the markdown report. `index_html_panel_sources_are_bare_
      view_names` (same file) enforces the rule structurally: a
      `panel-source` that is not exactly one snapshot table name fails.
    -->
    <main id="panels">
      <section id="panel-trust-matrix" class="panel">
        <h2>Change / Task Trust Matrix</h2>
        <p class="panel-source">mart_trust_matrix</p>
        <div class="panel-body"></div>
      </section>
      <section id="panel-session-costs" class="panel">
        <h2>Session Costs</h2>
        <p class="panel-source">mart_session_costs</p>
        <div class="panel-body"></div>
      </section>
      <section id="panel-role-memory" class="panel">
        <h2>Role Memory</h2>
        <p class="panel-source">mart_role_memory</p>
        <div class="panel-body"></div>
      </section>
      <section id="panel-flywheel-funnel" class="panel">
        <h2>Flywheel Funnel</h2>
        <p class="panel-source">mart_flywheel_funnel</p>
        <div class="panel-body"></div>
      </section>
      <section id="panel-review-burndown" class="panel">
        <h2>Review Burn-down</h2>
        <p class="panel-source">mart_review_burndown</p>
        <div class="panel-body"></div>
      </section>
      <section id="panel-review-rounds" class="panel">
        <h2>Review Rounds</h2>
        <p class="panel-source">mart_review_rounds</p>
        <div class="panel-body"></div>
      </section>
      <section id="panel-review-totals" class="panel">
        <h2>Review Totals</h2>
        <p class="panel-source">mart_review_totals</p>
        <div class="panel-body"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
